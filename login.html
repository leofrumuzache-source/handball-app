<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#2563EB">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="https://via.placeholder.com/192/2563EB/FFFFFF?text=🤾">
  <title>Login - Handball Club Management</title>
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/layout.css">
</head>
<body class="login-page">
  <div class="login-card">
    <div class="login-header">
      <div class="login-logo">🤾</div>
      <h1 class="login-title">Handball Club Management</h1>
      <p class="login-subtitle">Enter your PIN to access the system</p>
    </div>

    <form id="loginForm" novalidate>
      <div class="form-group">
        <label for="pinInput" class="form-label">PIN Code</label>
        <input
          type="password"
          id="pinInput"
          class="form-input login-pin-input"
          placeholder="••••••"
          maxlength="6"
          autocomplete="off"
          required
        >
        <div id="loginError" class="form-error hidden"></div>
      </div>

      <button type="submit" class="btn btn-primary btn-block btn-lg">
        🔓 Login
      </button>

      <p class="text-muted text-center mt-4" style="font-size: var(--font-size-sm);">
        ℹ️ Contact your administrator for access credentials
      </p>
    </form>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/ui.js"></script>
  <script>
    // Handle login form submission
    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();

      const pinInput = document.getElementById('pinInput');
      const errorEl = document.getElementById('loginError');
      const pin = pinInput.value.trim();

      // Clear previous errors
      errorEl.classList.add('hidden');
      pinInput.classList.remove('error');

      // Validate input
      if (!pin) {
        pinInput.classList.add('error');
        errorEl.textContent = 'Please enter your PIN';
        errorEl.classList.remove('hidden');
        return;
      }

      // Attempt login
      const result = AuthStore.login(pin);

      if (result.success) {
        Toast.success(`Welcome! ${result.accessLevel === 'master' ? 'Full' : 'Read-only'} access granted`);
        
        // Redirect to dashboard
        setTimeout(() => {
          window.location.href = 'index.html';
        }, 500);
      } else {
        pinInput.classList.add('error');
        errorEl.textContent = result.error;
        errorEl.classList.remove('hidden');
        pinInput.value = '';
        pinInput.focus();
      }
    });

    // Focus PIN input on load
    document.getElementById('pinInput').focus();

    // Clear error on input
    document.getElementById('pinInput').addEventListener('input', function() {
      const errorEl = document.getElementById('loginError');
      errorEl.classList.add('hidden');
      this.classList.remove('error');
    });
  </script>
  <script>
    // Register Service Worker for PWA offline support
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then((registration) => {
            console.log('SW registered:', registration.scope);
          })
          .catch((error) => {
            console.log('SW registration failed:', error);
          });
      });
    }
  </script>
</body>
</html>
